
<!DOCTYPE html>
<html>
<head>
    <title>Employee Salary Calculator</title>
</head>
<body>

    <h2>Employee Salary Calculator</h2>

    <label>Employee Name:</label>

    <p id="result"></p>

    <script src="script.js"></script>
</body>
</html>
