
<!DOCTYPE html>
<html>
<head>
    <title>Grocery Shopping Bill</title>
</head>
<body>
    <h2>Grocery Shopping Bill Generator</h2>

    <label>Rice Price (per kg):</label>
    <input type="number" id="ricePrice"><br><br>

    <label>Rice Quantity (kg):</label>
    <input type="number" id="riceQty"><br><br>

    <label>Oil Price (per litre):</label>
    <input type="number" id="oilPrice"><br><br>

    <label>Oil Quantity (litres):</label>
    <input type="number" id="oilQty"><br><br>

    <label>Sugar Price (per kg):</label>
    <input type="number" id="sugarPrice"><br><br>

    <label>Sugar Quantity (kg):</label>
    <input type="number" id="sugarQty"><br><br>

    <button onclick="generateBill()">Generate Bill</button>

    <p id="result"></p>

    <script src="script.js"></script>
</body>
</html>
