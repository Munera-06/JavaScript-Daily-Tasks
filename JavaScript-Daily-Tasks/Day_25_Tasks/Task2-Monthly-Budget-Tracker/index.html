<!DOCTYPE html>
<html>
<head>
    <title>Monthly Budget Tracker</title>
</head>
<body>
    <h2>Monthly Budget Tracker</h2>

    <label>Monthly Income (₹):</label>
    <input type="number" id="income"><br><br>

    <h3>Enter Your Expenses</h3>

    <label>Food (₹):</label>
    <input type="number" id="food"><br><br>

    <label>Travel (₹):</label>
    <input type="number" id="travel"><br><br>

    <label>Rent (₹):</label>
    <input type="number" id="rent"><br><br>

    <label>Shopping (₹):</label>
    <input type="number" id="shopping"><br><br>

    <label>Other Expenses (₹):</label>
    <input type="number" id="other"><br><br>

    <button onclick="calculateBudget()">Calculate Budget</button>

    <div id="result"></div>

    <script src="script.js"></script>
</body>
</html>
